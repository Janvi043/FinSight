<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-2xl font-semibold mb-4 text-center">Add Savings Goal</h2>
  <form (ngSubmit)="submit()" #goalForm="ngForm">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Goal Name</label>
      <input [(ngModel)]="name" name="name" id="name" type="text" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="target">Target Amount (₹)</label>
      <input [(ngModel)]="target" name="target" id="target" type="number" required min="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="deadline">Deadline (optional)</label>
      <input [(ngModel)]="deadline" name="deadline" id="deadline" type="date" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>
    <div class="flex justify-center">
      <button type="submit" [disabled]="!goalForm.form.valid" class="px-4 py-2 bg-cyan-600 text-white rounded hover:bg-cyan-700 transition-colors">
        Save Goal
      </button>
    </div>
  </form>
</div>
