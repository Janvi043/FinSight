<a routerLink="/login" class="block min-h-screen w-full relative overflow-hidden bg-slate-950 flex flex-col items-center justify-center cursor-pointer group no-underline text-current">
  
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 z-0">
    <!-- Glowing Orbs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl animate-pulse mix-blend-screen pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-blue-600/20 rounded-full blur-3xl animate-pulse mix-blend-screen pointer-events-none" style="animation-delay: 2s;"></div>
    
    <!-- Grid overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>
    <div class="absolute inset-0 bg-slate-950 [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,transparent_20%,black_100%)] pointer-events-none"></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 flex flex-col items-center text-center px-6">
    <!-- Icon/Logo -->
    <div class="w-20 h-20 mb-8 rounded-2xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 group-hover:scale-105 group-hover:shadow-cyan-400/50 transition-all duration-500">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="text-6xl md:text-8xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-100 to-white drop-shadow-[0_0_15px_rgba(34,211,238,0.4)] mb-6">
      FinSight
    </h1>

    <!-- Subtitle -->
    <p class="text-lg md:text-2xl text-slate-400 max-w-2xl font-light tracking-wide leading-relaxed">
      AI-Powered Personal Financial Forecasting<br class="hidden md:block" /> and Advisory System
    </p>
  </div>

  <!-- Bottom CTA -->
  <div class="absolute bottom-12 left-0 right-0 flex justify-center items-center z-10 animate-bounce">
    <p class="text-cyan-400 font-medium tracking-widest text-sm uppercase flex items-center gap-2 opacity-80 group-hover:opacity-100 transition-opacity">
      Tap Anywhere to Continue
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </p>
  </div>
</a>
