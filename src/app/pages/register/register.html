<div class="min-h-screen bg-slate-900 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4 relative overflow-hidden text-white font-sans">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
  <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-cyan-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>
  <div class="absolute bottom-1/4 left-1/2 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>
  <div class="relative w-full max-w-md bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl p-8 sm:p-10 z-10">
    <h1 class="text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Create Your FinSight Account</h1>
    <form class="space-y-4" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm font-medium mb-1" for="fullName">Full Name</label>
        <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" required class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="phone">Phone</label>
        <input type="tel" id="phone" [(ngModel)]="phone" name="phone" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="city">City</label>
          <input type="text" id="city" [(ngModel)]="city" name="city" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="country">Country</label>
          <input type="text" id="country" [(ngModel)]="country" name="country" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="monthlySalary">Monthly Salary</label>
        <input type="number" id="monthlySalary" [(ngModel)]="monthlySalary" name="monthlySalary" min="0" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      </div>
      <div class="flex justify-between items-center mt-6">
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl shadow-md transition-all duration-300">Create Account</button>
      </div>
      <p class="mt-4 text-center text-sm text-slate-400">Already have an account? <a routerLink="/login" class="text-cyan-400 hover:text-cyan-300">Sign In</a></p>
    </form>
  </div>
</div>
